# ============================================================
# EXECUTION CONFIGURATION
# ============================================================

execution:

  # ----------------------------------------------------------
  # Brokerage
  # ----------------------------------------------------------

  brokerage_per_side: 20.0

  # ----------------------------------------------------------
  # Slippage
  # ----------------------------------------------------------

  slippage_pct: 0.0005

  # ----------------------------------------------------------
  # STT
  # ----------------------------------------------------------

  stt_pct: 0.001

  # ----------------------------------------------------------
  # Misc Charges
  # Exchange + GST + SEBI + Stamp Approximation
  # ----------------------------------------------------------

  misc_charges_pct: 0.0002

  # ----------------------------------------------------------
  # Market Rules
  # ----------------------------------------------------------

  allow_fractional_position: false

  minimum_position_size: 1

  round_position_size: true